<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif">
  <!-- ============ 偏导数：一个输出，多个输入，各有一条敏感度 ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e88e5"/>
    </marker>
  </defs>

  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold">偏导数：一个输出，一堆参数</text>
  <text x="320" y="50" text-anchor="middle" font-size="14" fill="#666">对每个参数求导时，其他参数当常数，只看这一条路</text>

  <!-- 输出 loss（终点） -->
  <rect x="460" y="120" width="140" height="80" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="2"/>
  <text x="530" y="155" text-anchor="middle" font-size="17" font-weight="bold">loss</text>
  <text x="530" y="180" text-anchor="middle" font-size="12" fill="#c62828">∂ 记号 = 偏导数</text>

  <!-- 参数 w1 w2 w3 -->
  <rect x="40" y="40"  width="120" height="56" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="100" y="75" text-anchor="middle" font-size="17" font-weight="bold">w₁</text>

  <rect x="40" y="135" width="120" height="56" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="100" y="170" text-anchor="middle" font-size="17" font-weight="bold">w₂</text>

  <rect x="40" y="230" width="120" height="56" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="100" y="265" text-anchor="middle" font-size="17" font-weight="bold">w₃</text>

  <!-- 箭头 + 偏导标注 -->
  <line x1="160" y1="68" x2="458" y2="150" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="95" font-size="13" fill="#1e88e5">∂loss/∂w₁</text>

  <line x1="160" y1="163" x2="458" y2="160" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="150" font-size="13" fill="#1e88e5">∂loss/∂w₂</text>

  <line x1="160" y1="258" x2="458" y2="170" stroke="#1e88e5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="242" font-size="13" fill="#1e88e5">∂loss/∂w₃</text>

  <!-- 说明 -->
  <text x="320" y="310" text-anchor="middle" font-size="13" fill="#777">所有 ∂loss/∂wᵢ 合在一起，组成「梯度」向量 → 指向 loss 下降最快的方向</text>
</svg>
