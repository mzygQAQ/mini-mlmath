<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" font-family="sans-serif">
  <!-- ============ 汉明距离：逐位比较，数「不一样的位置」 ============ -->
  <!-- a = 1 0 1 1 0 1 0 1 ；b = 1 0 1 1 1 1 0 0 -->
  <!-- 只有第 5 位（a=0 vs b=1）和第 8 位（a=1 vs b=0）不同 → 汉明距离 = 2 -->

  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold">
    汉明距离：逐位比较 a 与 b，数「有几个位置不一样」
  </text>

  <!-- a 行：位下标 1..8。每位占 80px，起点 (140, 100) -->
  <text x="120" y="152" text-anchor="end" font-size="18" fill="#333">a =</text>
  <text x="160" y="152" text-anchor="middle" font-size="18" fill="#1e88e5">1</text>
  <text x="240" y="152" text-anchor="middle" font-size="18" fill="#1e88e5">0</text>
  <text x="320" y="152" text-anchor="middle" font-size="18" fill="#1e88e5">1</text>
  <text x="400" y="152" text-anchor="middle" font-size="18" fill="#1e88e5">1</text>
  <text x="480" y="152" text-anchor="middle" font-size="18" fill="#1e88e5">0</text>
  <text x="560" y="152" text-anchor="middle" font-size="18" fill="#1e88e5">1</text>
  <text x="640" y="152" text-anchor="middle" font-size="18" fill="#1e88e5">0</text>
  <text x="720" y="152" text-anchor="middle" font-size="18" fill="#1e88e5">1</text>

  <!-- b 行 -->
  <text x="120" y="242" text-anchor="end" font-size="18" fill="#333">b =</text>
  <text x="160" y="242" text-anchor="middle" font-size="18" fill="#e53935">1</text>
  <text x="240" y="242" text-anchor="middle" font-size="18" fill="#e53935">0</text>
  <text x="320" y="242" text-anchor="middle" font-size="18" fill="#e53935">1</text>
  <text x="400" y="242" text-anchor="middle" font-size="18" fill="#e53935">1</text>
  <text x="480" y="242" text-anchor="middle" font-size="18" fill="#e53935">1</text>
  <text x="560" y="242" text-anchor="middle" font-size="18" fill="#e53935">1</text>
  <text x="640" y="242" text-anchor="middle" font-size="18" fill="#e53935">0</text>
  <text x="720" y="242" text-anchor="middle" font-size="18" fill="#e53935">0</text>

  <!-- 位下标 1..8 -->
  <text x="160" y="90" text-anchor="middle" font-size="12" fill="#999">1</text>
  <text x="240" y="90" text-anchor="middle" font-size="12" fill="#999">2</text>
  <text x="320" y="90" text-anchor="middle" font-size="12" fill="#999">3</text>
  <text x="400" y="90" text-anchor="middle" font-size="12" fill="#999">4</text>
  <text x="480" y="90" text-anchor="middle" font-size="12" fill="#999">5</text>
  <text x="560" y="90" text-anchor="middle" font-size="12" fill="#999">6</text>
  <text x="640" y="90" text-anchor="middle" font-size="12" fill="#999">7</text>
  <text x="720" y="90" text-anchor="middle" font-size="12" fill="#999">8</text>

  <!-- 相同的位：a、b 之间画淡线 -->
  <line x1="160" y1="168" x2="160" y2="226" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="240" y1="168" x2="240" y2="226" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="320" y1="168" x2="320" y2="226" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="400" y1="168" x2="400" y2="226" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="560" y1="168" x2="560" y2="226" stroke="#cfd8dc" stroke-width="2"/>
  <line x1="640" y1="168" x2="640" y2="226" stroke="#cfd8dc" stroke-width="2"/>

  <!-- 不同的位：红竖线 + ✗ -->
  <line x1="480" y1="168" x2="480" y2="226" stroke="#e53935" stroke-width="3"/>
  <line x1="720" y1="168" x2="720" y2="226" stroke="#e53935" stroke-width="3"/>
  <text x="480" y="180" text-anchor="middle" font-size="16" fill="#c62828">✗</text>
  <text x="720" y="180" text-anchor="middle" font-size="16" fill="#c62828">✗</text>

  <!-- 底部结论 -->
  <text x="470" y="286" text-anchor="middle" font-size="15" fill="#c62828">
    只有第 5、8 位不同 → 汉明距离 = 2
  </text>
</svg>
