<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="sans-serif">
  <!-- ============ sin x 与 cos x ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <text x="260" y="26" text-anchor="middle" font-size="19" font-weight="bold">三角函数：sin x 与 cos x（周期 2π）</text>

  <!-- 坐标轴（x:±2π→80/440，y:±1.5→30/270） -->
  <line x1="40" y1="150" x2="480" y2="150" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="300" x2="260" y2="30" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="168" font-size="13" fill="#333" font-style="italic">x</text>
  <text x="248" y="44" font-size="13" fill="#333" font-style="italic">y</text>

  <!-- 刻度 -->
  <text x="80"  y="164" text-anchor="middle" font-size="11" fill="#888">-2π</text>
  <text x="170" y="164" text-anchor="middle" font-size="11" fill="#888">-π</text>
  <text x="260" y="164" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="350" y="164" text-anchor="middle" font-size="11" fill="#888">π</text>
  <text x="440" y="164" text-anchor="middle" font-size="11" fill="#888">2π</text>
  <text x="252" y="75"  font-size="11" fill="#888">1</text>
  <text x="252" y="235" font-size="11" fill="#888">-1</text>

  <!-- sin x（蓝） -->
  <polyline points="80,150 125,110 140,81 155,230 170,219 185,110 200,150 215,110 230,81 245,230 260,219 275,190 290,150 305,110 320,81 335,70 350,81 365,110 380,150 395,190 410,219 425,230 440,219 455,190 470,150"
            fill="none" stroke="#1e88e5" stroke-width="2.5"/>

  <!-- cos x（红） -->
  <polyline points="80,70 125,81 140,110 155,150 170,190 185,219 200,230 215,219 230,190 245,150 260,110 275,81 290,70 305,81 320,110 335,150 350,190 365,219 380,230 395,219 410,190 425,150 440,110"
            fill="none" stroke="#e53935" stroke-width="2.5"/>

  <!-- 周期标注 -->
  <line x1="200" y1="150" x2="380" y2="150" stroke="#333" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="290" y="140" font-size="12" fill="#333">一个周期 2π</text>

  <!-- 峰值 -->
  <circle cx="335" cy="70" r="4" fill="#1e88e5"/>
  <circle cx="290" cy="70" r="4" fill="#e53935"/>
  <text x="336" y="60" font-size="12" fill="#1e88e5">sin 峰值 1</text>
  <text x="292" y="60" font-size="12" fill="#e53935">cos 峰值 1</text>

  <!-- 图例 -->
  <text x="300" y="105" font-size="14" fill="#1e88e5">y = sin x</text>
  <text x="300" y="125" font-size="14" fill="#e53935">y = cos x</text>

  <!-- 特性 -->
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#777">cos x = sin(x + π/2)：同一个波左移 90° —— Transformer 位置编码就是这对组合</text>
</svg>
