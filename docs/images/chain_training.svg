<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="sans-serif">
  <!-- ============ 训练循环：backward 就是自动执行链式法则 ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e88e5"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-size="20" font-weight="bold">训练循环：链式法则在哪个环节</text>

  <!-- forward -->
  <rect x="60"  y="80" width="240" height="80" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="180" y="112" text-anchor="middle" font-size="17" font-weight="bold">1. 前向</text>
  <text x="180" y="138" text-anchor="middle" font-size="12" fill="#2e7d32">算出 loss（顺带建图）</text>

  <!-- backward -->
  <rect x="460" y="80" width="240" height="80" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="2.5"/>
  <text x="580" y="112" text-anchor="middle" font-size="17" font-weight="bold">2. 反向 backward()</text>
  <text x="580" y="138" text-anchor="middle" font-size="12" fill="#c62828">链式法则把梯度传到每个参数</text>

  <!-- update -->
  <rect x="460" y="210" width="240" height="80" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
  <text x="580" y="242" text-anchor="middle" font-size="17" font-weight="bold">3. 更新</text>
  <text x="580" y="268" text-anchor="middle" font-size="12" fill="#e65100">w ← w − lr · w.grad</text>

  <!-- 环形箭头 -->
  <line x1="300" y1="120" x2="458" y2="120" stroke="#1e88e5" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="580" y1="160" x2="580" y2="208" stroke="#1e88e5" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="250" x2="302" y2="250" stroke="#1e88e5" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="180" y1="250" x2="180" y2="162" stroke="#1e88e5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="180" y="285" text-anchor="middle" font-size="12" fill="#777">回到 1，重复直到收敛</text>

  <!-- 中心说明 -->
  <text x="380" y="180" text-anchor="middle" font-size="14" fill="#444">第 2 步 = 自动执行链式法则</text>
  <text x="380" y="202" text-anchor="middle" font-size="13" fill="#888">手写模型时你在亲手做它；autograd.h 让机器做</text>

  <!-- 底部 -->
  <text x="380" y="330" text-anchor="middle" font-size="13" fill="#777">链式法则是「算梯度的规则」，autograd 是「自动执行这套规则」的机器</text>
</svg>
