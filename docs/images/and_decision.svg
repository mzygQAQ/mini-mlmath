<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" font-family="sans-serif">
  <!-- 标题 -->
  <text x="230" y="30" text-anchor="middle" font-size="20" font-weight="bold">AND 门：决策线 x₁ + x₂ = 1.5</text>
  <text x="230" y="52" text-anchor="middle" font-size="13" fill="#666">只有 (1,1) 在右上（浅红）一侧 → 输出 1，其余输出 0</text>

  <!-- 判 1 区域（x₁+x₂ > 1.5 的右上角，半透明） -->
  <polygon points="60,80 360,80 360,380" fill="#ffcdd2" opacity="0.55"/>

  <!-- 坐标轴 -->
  <line x1="60" y1="380" x2="400" y2="380" stroke="#999" stroke-width="1.5"/>
  <line x1="60" y1="380" x2="60" y2="40" stroke="#999" stroke-width="1.5"/>
  <!-- x1 刻度 -->
  <text x="60"  y="398" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="160" y="398" text-anchor="middle" font-size="12" fill="#666">0.5</text>
  <text x="260" y="398" text-anchor="middle" font-size="12" fill="#666">1</text>
  <text x="360" y="398" text-anchor="middle" font-size="12" fill="#666">1.5</text>
  <text x="405" y="398" font-size="14" fill="#333" font-style="italic">x₁</text>
  <!-- x2 刻度 -->
  <text x="50" y="285" text-anchor="end" font-size="12" fill="#666">0.5</text>
  <text x="50" y="185" text-anchor="end" font-size="12" fill="#666">1</text>
  <text x="50" y="85"  text-anchor="end" font-size="12" fill="#666">1.5</text>
  <text x="48" y="48"  font-size="14" fill="#333" font-style="italic">x₂</text>

  <!-- 决策线 x1 + x2 = 1.5 -->
  <line x1="60" y1="80" x2="360" y2="380" stroke="#333" stroke-width="2.5"/>

  <!-- 四个样本点：蓝 = 输出 0，红 = 输出 1 -->
  <circle cx="60"  cy="380" r="11" fill="#1e88e5" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="60"  y="404" text-anchor="middle" font-size="12" fill="#333">(0,0) → 0</text>
  <circle cx="60"  cy="180" r="11" fill="#1e88e5" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="76"  y="175" font-size="12" fill="#333">(0,1) → 0</text>
  <circle cx="260" cy="380" r="11" fill="#1e88e5" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="260" y="404" text-anchor="middle" font-size="12" fill="#333">(1,0) → 0</text>
  <circle cx="260" cy="180" r="11" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="276" y="175" font-size="12" fill="#333">(1,1) → 1</text>

  <!-- 图例 -->
  <circle cx="90" cy="445" r="7" fill="#1e88e5"/>
  <text x="102" y="450" font-size="13" fill="#333">输出 0</text>
  <circle cx="180" cy="445" r="7" fill="#e53935"/>
  <text x="192" y="450" font-size="13" fill="#333">输出 1</text>
  <line x1="280" y1="445" x2="330" y2="445" stroke="#333" stroke-width="2.5"/>
  <text x="336" y="450" font-size="13" fill="#333">决策线</text>
</svg>
