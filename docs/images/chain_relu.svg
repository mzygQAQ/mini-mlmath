<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="sans-serif">
  <!-- ============ ReLU 的导数：正数区 1，负数区 0 ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <text x="260" y="28" text-anchor="middle" font-size="20" font-weight="bold">ReLU 的导数：正数区为 1，负数区为 0</text>

  <!-- 坐标轴 -->
  <line x1="60" y1="260" x2="460" y2="260" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="260" x2="60" y2="40"  stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="448" y="278" font-size="14" fill="#333" font-style="italic">z</text>
  <text x="48"  y="52"  font-size="14" fill="#333" font-style="italic">y</text>

  <!-- relu 曲线：z<0 -> 0，z>0 -> z -->
  <line x1="60"  y1="260" x2="258" y2="260" stroke="#1e88e5" stroke-width="3"/>
  <line x1="262" y1="258" x2="460" y2="60"  stroke="#1e88e5" stroke-width="3"/>
  <circle cx="260" cy="260" r="5" fill="#1e88e5"/>

  <!-- 导数标注 -->
  <text x="150" y="250" text-anchor="middle" font-size="15" fill="#c62828">导数 = 0</text>
  <text x="150" y="270" text-anchor="middle" font-size="12" fill="#888">z ≤ 0：水平线，不随 z 变</text>

  <text x="370" y="90" text-anchor="middle" font-size="15" fill="#2e7d32">导数 = 1</text>
  <text x="370" y="110" text-anchor="middle" font-size="12" fill="#888">z &gt; 0：45° 斜线，梯度原样通过</text>

  <!-- 结论 -->
  <rect x="80" y="200" width="360" height="50" rx="10" fill="#fff8e1" stroke="#fb8c00" stroke-width="2"/>
  <text x="260" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">反向时：正数区 ×1，负数区 ×0</text>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#888">负数区的神经元梯度为 0，再也不更新（dying ReLU）</text>
</svg>
