<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="sans-serif">
  <!-- ============ 链式法则数值例子：两段斜率相乘 ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e88e5"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="20" font-weight="bold">链式法则：两段变化率相乘</text>
  <text x="360" y="52" text-anchor="middle" font-size="14" fill="#666">u = 2x+1，y = u²，取 x = 1 → u = 3 → y = 9</text>

  <!-- 三个量 -->
  <rect x="30"  y="80" width="100" height="70" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="80" y="115" text-anchor="middle" font-size="19" font-weight="bold">x = 1</text>

  <rect x="300" y="80" width="100" height="70" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="350" y="115" text-anchor="middle" font-size="19" font-weight="bold">u = 3</text>

  <rect x="570" y="80" width="100" height="70" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="620" y="115" text-anchor="middle" font-size="19" font-weight="bold">y = 9</text>

  <!-- 段标注（每段一个斜率） -->
  <line x1="130" y1="115" x2="298" y2="115" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="214" y="105" text-anchor="middle" font-size="14" fill="#2e7d32">du/dx = 2</text>
  <text x="214" y="148" text-anchor="middle" font-size="12" fill="#888">x 动 1，u 动 2</text>

  <line x1="400" y1="115" x2="568" y2="115" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="484" y="105" text-anchor="middle" font-size="14" fill="#2e7d32">dy/du = 6</text>
  <text x="484" y="148" text-anchor="middle" font-size="12" fill="#888">u 动 1，y 动 6（在 u=3 处）</text>

  <!-- 结论框 -->
  <rect x="90" y="190" width="540" height="70" rx="10" fill="#fff8e1" stroke="#fb8c00" stroke-width="2"/>
  <text x="360" y="220" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">dy/dx = dy/du · du/dx = 6 × 2 = 12</text>
  <text x="360" y="246" text-anchor="middle" font-size="13" fill="#888">两段斜率相乘，中间量 u 自己抵消</text>
</svg>
