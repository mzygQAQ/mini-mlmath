<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" font-family="sans-serif">
  <!-- ============ Lp 单位球：d=2 时「到原点距离 = 1」的边界 ============ -->
  <!-- L∞ 正方形 ⊃ L2 圆 ⊃ L1 菱形（菱形在圆内，圆在正方形内） -->
  <!-- 原点映射：中心 (470,470)，scale = 150 px / 单位；y 轴向上为正 -->
  <!-- x 刻度：-1.5→245, -1→320, -0.5→395, 0→470, 0.5→545, 1→620, 1.5→695 -->
  <!-- y 刻度同 x（canvas 向下增大，故 t>0 时 cy = 470 - 150t）-->

  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold">
    Lp 单位球：到原点距离 = 1 的点集（d = 2 时三条边界）
  </text>

  <!-- 坐标轴 -->
  <line x1="110" y1="470" x2="840" y2="470" stroke="#999" stroke-width="1.5"/>
  <line x1="470" y1="90" x2="470" y2="740" stroke="#999" stroke-width="1.5"/>
  <text x="848" y="484" font-size="14" fill="#333" font-style="italic">Δx₁</text>
  <text x="458" y="82" font-size="14" fill="#333" font-style="italic" text-anchor="middle">Δx₂</text>
  <text x="470" y="475" font-size="12" fill="#666">0</text>

  <!-- x 轴刻度 + 数值标签（画在轴下方） -->
  <line x1="245" y1="466" x2="245" y2="474" stroke="#666" stroke-width="1"/><text x="245" y="490" text-anchor="middle" font-size="12" fill="#666">-1.5</text>
  <line x1="320" y1="466" x2="320" y2="474" stroke="#666" stroke-width="1"/><text x="320" y="490" text-anchor="middle" font-size="12" fill="#666">-1</text>
  <line x1="395" y1="466" x2="395" y2="474" stroke="#666" stroke-width="1"/><text x="395" y="490" text-anchor="middle" font-size="12" fill="#666">-0.5</text>
  <line x1="545" y1="466" x2="545" y2="474" stroke="#666" stroke-width="1"/><text x="545" y="490" text-anchor="middle" font-size="12" fill="#666">0.5</text>
  <line x1="620" y1="466" x2="620" y2="474" stroke="#666" stroke-width="1"/><text x="620" y="490" text-anchor="middle" font-size="12" fill="#666">1</text>
  <line x1="695" y1="466" x2="695" y2="474" stroke="#666" stroke-width="1"/><text x="695" y="490" text-anchor="middle" font-size="12" fill="#666">1.5</text>

  <!-- y 轴刻度 + 数值标签（画在轴左侧） -->
  <line x1="466" y1="695" x2="474" y2="695" stroke="#666" stroke-width="1"/><text x="458" y="699" text-anchor="end" font-size="12" fill="#666">-1.5</text>
  <line x1="466" y1="620" x2="474" y2="620" stroke="#666" stroke-width="1"/><text x="458" y="624" text-anchor="end" font-size="12" fill="#666">-1</text>
  <line x1="466" y1="545" x2="474" y2="545" stroke="#666" stroke-width="1"/><text x="458" y="549" text-anchor="end" font-size="12" fill="#666">-0.5</text>
  <line x1="466" y1="395" x2="474" y2="395" stroke="#666" stroke-width="1"/><text x="458" y="399" text-anchor="end" font-size="12" fill="#666">0.5</text>
  <line x1="466" y1="320" x2="474" y2="320" stroke="#666" stroke-width="1"/><text x="458" y="324" text-anchor="end" font-size="12" fill="#666">1</text>
  <line x1="466" y1="245" x2="474" y2="245" stroke="#666" stroke-width="1"/><text x="458" y="249" text-anchor="end" font-size="12" fill="#666">1.5</text>

  <!-- L∞：边长为 2 的正方形：|Δx₁| ≤ 1 且 |Δx₂| ≤ 1，顶点在 (±1,±1) -->
  <rect x="320" y="320" width="300" height="300"
        fill="#43a047" fill-opacity="0.10" stroke="#43a047" stroke-width="3"/>
  <!-- 顶点标点 -->
  <circle cx="320" cy="320" r="3.5" fill="#43a047"/>
  <circle cx="620" cy="320" r="3.5" fill="#43a047"/>
  <circle cx="620" cy="620" r="3.5" fill="#43a047"/>
  <circle cx="320" cy="620" r="3.5" fill="#43a047"/>

  <!-- L2：半径为 1 的圆：Δx₁² + Δx₂² = 1 -->
  <circle cx="470" cy="470" r="150"
          fill="#1e88e5" fill-opacity="0.15" stroke="#1e88e5" stroke-width="3"/>

  <!-- L1：菱形：|Δx₁| + |Δx₂| ≤ 1，顶点在 (±1,0) / (0,±1) -->
  <polygon points="320,470 470,320 620,470 470,620"
           fill="#ef6c00" fill-opacity="0.22" stroke="#ef6c00" stroke-width="3"/>
  <circle cx="320" cy="470" r="3.5" fill="#ef6c00"/>
  <circle cx="470" cy="320" r="3.5" fill="#ef6c00"/>
  <circle cx="620" cy="470" r="3.5" fill="#ef6c00"/>
  <circle cx="470" cy="620" r="3.5" fill="#ef6c00"/>

  <!-- 图例（右上方） -->
  <rect x="702" y="150" width="26" height="26" fill="#43a047" fill-opacity="0.25" stroke="#43a047" stroke-width="2.5"/>
  <text x="742" y="161" font-size="14" fill="#333">L∞ 切比雪夫</text>
  <text x="742" y="179" font-size="13" fill="#555">max(|Δx₁|, |Δx₂|) = 1</text>

  <circle cx="715" cy="250" r="13" fill="#1e88e5" fill-opacity="0.3" stroke="#1e88e5" stroke-width="2.5"/>
  <text x="742" y="255" font-size="14" fill="#333">L2 欧氏</text>
  <text x="742" y="273" font-size="13" fill="#555">√(Δx₁² + Δx₂²) = 1</text>

  <polygon points="702,356 715,343 728,356 715,369"
           fill="#ef6c00" fill-opacity="0.35" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="742" y="352" font-size="14" fill="#333">L1 曼哈顿</text>
  <text x="742" y="370" font-size="13" fill="#555">|Δx₁| + |Δx₂| = 1</text>

  <!-- 底部说明 -->
  <text x="470" y="660" text-anchor="middle" font-size="15" fill="#333">
    三者都是「到原点距离 = 1」的边界，但形状差很多：边界越大 → 度量越宽松。
  </text>
  <text x="470" y="684" text-anchor="middle" font-size="15" fill="#1565c0">
    L∞ 最宽松：只要没有一维超界，别的维差再大都算近；L2 居中；L1 最严格（各维差距会被累加）。
  </text>
</svg>
