<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="sans-serif">
  <!-- ============ 一个反向节点的放大：前向存输入值，反向拆梯度 ============ -->
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e88e5"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53935"/>
    </marker>
  </defs>

  <text x="350" y="26" text-anchor="middle" font-size="20" font-weight="bold">一个反向节点在做什么</text>
  <text x="350" y="48" text-anchor="middle" font-size="14" fill="#666">前向把输入值存进节点；反向用公式把上游梯度拆给每个输入</text>

  <!-- 输入 a / b（蓝） -->
  <rect x="50" y="105" width="100" height="60" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="100" y="131" text-anchor="middle" font-size="17" font-weight="bold">a（输入）</text>
  <text x="100" y="153" text-anchor="middle" font-size="11" fill="#555">值被节点记住</text>

  <rect x="50" y="235" width="100" height="60" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="100" y="261" text-anchor="middle" font-size="17" font-weight="bold">b（输入）</text>
  <text x="100" y="283" text-anchor="middle" font-size="11" fill="#555">值被节点记住</text>

  <!-- 节点（绿） -->
  <rect x="250" y="90" width="210" height="160" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="355" y="122" text-anchor="middle" font-size="18" font-weight="bold">MulNode</text>
  <text x="355" y="150" text-anchor="middle" font-size="13" fill="#2e7d32">da = g ⊙ b</text>
  <text x="355" y="174" text-anchor="middle" font-size="13" fill="#2e7d32">db = g ⊙ a</text>
  <text x="355" y="204" text-anchor="middle" font-size="12" fill="#777">g = 上游梯度</text>
  <text x="355" y="228" text-anchor="middle" font-size="11" fill="#888">apply()：局部导数公式</text>

  <!-- 输出 y（蓝） -->
  <rect x="580" y="140" width="100" height="60" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="630" y="166" text-anchor="middle" font-size="17" font-weight="bold">y = a⊙b</text>
  <text x="630" y="188" text-anchor="middle" font-size="11" fill="#555">输出张量</text>

  <!-- 前向（蓝） -->
  <line x1="150" y1="135" x2="248" y2="135" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="150" y1="265" x2="248" y2="265" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="460" y1="170" x2="578" y2="170" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <text x="350" y="168" font-size="12" fill="#1e88e5">值（前向算好）</text>

  <!-- 反向（红虚线）：上游梯度进节点，拆成输入梯度 -->
  <line x1="630" y1="200" x2="462" y2="200" stroke="#e53935" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowR)"/>
  <text x="505" y="222" font-size="13" fill="#c62828">g（上游梯度）</text>

  <line x1="290" y1="255" x2="152" y2="180" stroke="#e53935" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowR)"/>
  <text x="120" y="200" font-size="13" fill="#c62828">da = g ⊙ b</text>

  <line x1="290" y1="290" x2="152" y2="280" stroke="#e53935" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowR)"/>
  <text x="160" y="320" font-size="13" fill="#c62828">db = g ⊙ a</text>

  <!-- 底部说明 -->
  <text x="350" y="330" text-anchor="middle" font-size="12" fill="#777">每个算子只需要知道「对每个输入怎么求偏导」——其余交给图遍历把梯度串起来</text>
</svg>
