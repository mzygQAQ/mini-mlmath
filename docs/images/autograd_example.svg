<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="sans-serif">
  <!-- ============ 手算例子：a = [1,2], w = [3,4], y = a⊙w = [3,8], loss = sum(y) = 11 ============ -->
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e88e5"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53935"/>
    </marker>
  </defs>

  <text x="470" y="28" text-anchor="middle" font-size="20" font-weight="bold">反向传播的一个完整小例子</text>
  <text x="470" y="50" text-anchor="middle" font-size="14" fill="#666">a = [1, 2]，w = [3, 4]，y = a⊙w = [3, 8]，loss = sum(y) = 11</text>

  <!-- 叶子参数（橙） -->
  <rect x="30" y="120" width="130" height="70" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
  <text x="95" y="150" text-anchor="middle" font-size="18" font-weight="bold">a = [1, 2]</text>
  <text x="95" y="174" text-anchor="middle" font-size="12" fill="#888">叶子（track）</text>

  <rect x="30" y="260" width="130" height="70" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2.5"/>
  <text x="95" y="290" text-anchor="middle" font-size="18" font-weight="bold">w = [3, 4]</text>
  <text x="95" y="314" text-anchor="middle" font-size="12" fill="#888">叶子（track）</text>

  <!-- Mul 节点（绿） -->
  <rect x="210" y="170" width="160" height="110" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="290" y="202" text-anchor="middle" font-size="17" font-weight="bold">Mul（逐元素乘）</text>
  <text x="290" y="230" text-anchor="middle" font-size="14" fill="#2e7d32">da = g ⊙ b</text>
  <text x="290" y="252" text-anchor="middle" font-size="14" fill="#2e7d32">db = g ⊙ a</text>
  <text x="290" y="272" text-anchor="middle" font-size="11" fill="#888">局部导数公式</text>

  <!-- y 中间量（蓝） -->
  <rect x="430" y="175" width="120" height="80" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="490" y="210" text-anchor="middle" font-size="18" font-weight="bold">y = [3, 8]</text>
  <text x="490" y="236" text-anchor="middle" font-size="11" fill="#555">grad_fn = MulNode</text>

  <!-- Sum 节点（绿） -->
  <rect x="610" y="170" width="130" height="100" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="675" y="202" text-anchor="middle" font-size="17" font-weight="bold">Sum（求和）</text>
  <text x="675" y="232" text-anchor="middle" font-size="14" fill="#2e7d32">da = 填满 g</text>
  <text x="675" y="252" text-anchor="middle" font-size="11" fill="#888">(把上游梯度复制到每个元素)</text>

  <!-- loss 终点 -->
  <rect x="800" y="175" width="110" height="80" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2"/>
  <text x="855" y="210" text-anchor="middle" font-size="18" font-weight="bold">loss = 11</text>
  <text x="855" y="240" text-anchor="middle" font-size="12" fill="#c62828">初始 g = 1</text>

  <!-- 前向（蓝） -->
  <line x1="160" y1="145" x2="208" y2="195" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="160" y1="285" x2="208" y2="275" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="370" y1="225" x2="428" y2="215" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="550" y1="215" x2="608" y2="215" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrowF)"/>
  <line x1="740" y1="220" x2="798" y2="215" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#arrowF)"/>

  <!-- 反向（红虚线） -->
  <line x1="800" y1="255" x2="742" y2="255" stroke="#e53935" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowR)"/>
  <text x="755" y="276" font-size="13" fill="#c62828">g = 1</text>

  <line x1="610" y1="255" x2="552" y2="240" stroke="#e53935" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowR)"/>
  <text x="565" y="282" font-size="13" fill="#c62828">y.grad = [1, 1]</text>

  <line x1="430" y1="255" x2="372" y2="262" stroke="#e53935" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowR)"/>
  <text x="380" y="295" font-size="13" fill="#c62828">[1, 1]</text>

  <line x1="220" y1="290" x2="163" y2="200" stroke="#e53935" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowR)"/>
  <text x="200" y="348" font-size="13" fill="#c62828">da = g ⊙ b = [3, 4]</text>

  <line x1="220" y1="312" x2="163" y2="315" stroke="#e53935" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrowR)"/>
  <text x="160" y="372" font-size="13" fill="#c62828">db = g ⊙ a = [1, 2]</text>

  <!-- 图例 -->
  <line x1="470" y1="395" x2="520" y2="395" stroke="#1e88e5" stroke-width="2.5"/>
  <text x="530" y="400" font-size="13" fill="#555">前向：算值 + 建图</text>
  <line x1="660" y1="395" x2="710" y2="395" stroke="#e53935" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="720" y="400" font-size="13" fill="#555">反向：梯度信号倒着传</text>
</svg>
