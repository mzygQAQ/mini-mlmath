<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="sans-serif">
  <!-- ============ 线性回归拟合示意：散点 + 最佳直线 + 残差竖线 ============ -->

  <!-- 标题 -->
  <text x="300" y="28" text-anchor="middle" font-size="18" font-weight="bold">线性回归：拟合一条让残差平方和最小的直线</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="350" x2="540" y2="350" stroke="#999" stroke-width="1.5"/>
  <line x1="70" y1="350" x2="70"  y2="60"  stroke="#999" stroke-width="1.5"/>

  <!-- x 轴刻度 -->
  <text x="70"  y="370" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="187" y="370" text-anchor="middle" font-size="12" fill="#666">1</text>
  <text x="305" y="370" text-anchor="middle" font-size="12" fill="#666">2</text>
  <text x="422" y="370" text-anchor="middle" font-size="12" fill="#666">3</text>
  <text x="540" y="370" text-anchor="middle" font-size="12" fill="#666">4</text>
  <text x="555" y="370" font-size="14" fill="#333" font-style="italic">x</text>

  <!-- y 轴刻度 -->
  <text x="60" y="354" text-anchor="end" font-size="12" fill="#666">0</text>
  <text x="60" y="277" text-anchor="end" font-size="12" fill="#666">2</text>
  <text x="60" y="200" text-anchor="end" font-size="12" fill="#666">4</text>
  <text x="60" y="123" text-anchor="end" font-size="12" fill="#666">6</text>
  <text x="60" y="64"  text-anchor="end" font-size="12" fill="#666">8</text>
  <text x="40" y="60"  font-size="14" fill="#333" font-style="italic">y</text>

  <!-- 拟合直线 ŷ = 1.5x + 1.2 （y 范围 1.2 到 7.2，对应 x=0 到 x=4） -->
  <!-- x=70 (axis) 对应 x=0，y=350 对应 y=0；每单位 x 117px，每单位 y 46.5px -->
  <!-- x=0: y=1.2 -> 350 - 1.2*46.5 = 350 - 55.8 = 294.2 -->
  <!-- x=4: y=7.2 -> 350 - 7.2*46.5 = 350 - 334.8 = 15.2 -->
  <line x1="70" y1="294" x2="540" y2="15" stroke="#1e88e5" stroke-width="3"/>
  <text x="500" y="50" font-size="14" fill="#1e88e5" font-weight="bold">ŷ = w·x + b</text>
  <text x="500" y="68" font-size="12" fill="#1e88e5">（拟合直线）</text>

  <!-- 散点 + 残差竖线（8 个点，围绕 y=1.5x+1.2 上下波动） -->
  <!-- helper: 点(x, y_real) -> 像素(x_px, y_px) = (70 + x*117, 350 - y*46.5) -->

  <!-- 点 1: x=0.3, y_real=2.0, ŷ=1.65, 残差 0.35 (正方向) -->
  <line x1="105" y1="257" x2="105" y2="273" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="105" cy="257" r="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- 点 2: x=0.6, y_real=1.4, ŷ=2.10, 残差 -0.70 (负方向) -->
  <line x1="140" y1="252" x2="140" y2="285" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="140" cy="285" r="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- 点 3: x=1.0, y_real=3.5, ŷ=2.70, 残差 0.80 (正方向) -->
  <line x1="187" y1="187" x2="187" y2="224" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="187" cy="187" r="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- 点 4: x=1.5, y_real=3.0, ŷ=3.45, 残差 -0.45 (负方向) -->
  <line x1="245" y1="190" x2="245" y2="211" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="245" cy="211" r="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- 点 5: x=2.0, y_real=4.8, ŷ=4.20, 残差 0.60 (正方向) -->
  <line x1="304" y1="100" x2="304" y2="128" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="304" cy="100" r="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- 点 6: x=2.5, y_real=4.5, ŷ=4.95, 残差 -0.45 (负方向) -->
  <line x1="363" y1="115" x2="363" y2="136" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="363" cy="136" r="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- 点 7: x=3.2, y_real=6.5, ŷ=6.00, 残差 0.50 (正方向) -->
  <line x1="444" y1="50" x2="444" y2="73" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="444" cy="50" r="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- 点 8: x=3.8, y_real=6.4, ŷ=6.90, 残差 -0.50 (负方向) -->
  <line x1="515" y1="58" x2="515" y2="81" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>
  <circle cx="515" cy="81" r="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>

  <!-- 图例 -->
  <rect x="380" y="280" width="200" height="60" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
  <!-- 数据点示例 -->
  <circle cx="395" cy="297" r="5" fill="#1e88e5" stroke="#0d47a1" stroke-width="1"/>
  <text x="408" y="301" font-size="12" fill="#333">训练样本 (x_i, y_i)</text>
  <!-- 残差示例 -->
  <line x1="392" y1="318" x2="402" y2="318" stroke="#c62828" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="408" y="322" font-size="12" fill="#333">残差 y_i - ŷ_i</text>
  <line x1="392" y1="333" x2="408" y2="333" stroke="#1e88e5" stroke-width="3"/>
  <text x="418" y="337" font-size="12" fill="#333">拟合直线 ŷ = w·x + b</text>
</svg>
