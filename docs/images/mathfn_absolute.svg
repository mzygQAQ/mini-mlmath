<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="sans-serif">
  <!-- ============ 绝对值：y = |x| V 形折线 ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <text x="260" y="26" text-anchor="middle" font-size="19" font-weight="bold">绝对值：y = |x|（V 形折线）</text>

  <!-- 坐标轴（原点 260,150，x:±2→80/440，y:2→50） -->
  <line x1="40" y1="150" x2="480" y2="150" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="300" x2="260" y2="40" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="168" font-size="13" fill="#333" font-style="italic">x</text>
  <text x="248" y="54" font-size="13" fill="#333" font-style="italic">y</text>
  <text x="80"  y="164" text-anchor="middle" font-size="11" fill="#888">-2</text>
  <text x="170" y="164" text-anchor="middle" font-size="11" fill="#888">-1</text>
  <text x="350" y="164" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="440" y="164" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="252" y="105" font-size="11" fill="#888">1</text>
  <text x="252" y="55"  font-size="11" fill="#888">2</text>

  <!-- V 形折线 -->
  <line x1="80" y1="50" x2="260" y2="150" stroke="#1e88e5" stroke-width="3"/>
  <line x1="260" y1="150" x2="440" y2="50" stroke="#1e88e5" stroke-width="3"/>
  <circle cx="260" cy="150" r="6" fill="#e53935"/>

  <!-- 分段标注 -->
  <text x="140" y="90" text-anchor="middle" font-size="13" fill="#e53935">x &lt; 0：y = −x</text>
  <text x="140" y="110" text-anchor="middle" font-size="12" fill="#888">斜率 −1</text>
  <text x="380" y="90" text-anchor="middle" font-size="13" fill="#2e7d32">x &gt; 0：y = x</text>
  <text x="380" y="110" text-anchor="middle" font-size="12" fill="#888">斜率 +1</text>

  <!-- 折角说明 -->
  <text x="260" y="196" text-anchor="middle" font-size="13" fill="#c62828">折角处（x=0）导数不存在</text>
  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#777">左边斜率 −1、右边 +1，跳变</text>

  <!-- 底部 -->
  <text x="260" y="268" text-anchor="middle" font-size="13" fill="#444">L1 损失 |y − ŷ| 的原料：对离群点惩罚比平方温和</text>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#777">除折角外导数都是 sign(x)（±1）——链式法则里乘的就是它</text>
</svg>
