<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="sans-serif">
  <!-- ============ 位置编码：同一公式、三条不同维度的 sin 曲线 ============ -->
  <!-- 角频率 w_i = 1/10000^(2i/d_model)（d_model=8）：i=0→1.00、i=1→0.10、i=2→0.01 -->
  <!-- 曲线映射：px = 90 + pos*11；py = 240 - sin(w*pos)*150 -->

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold">
    同一公式画三条曲线：维度 i 越小震荡越快、越大震荡越慢
  </text>
  <text x="470" y="57" text-anchor="middle" font-size="14" fill="#555">
    PE(pos, 2i) = sin(pos / 10000^(2i/d)) —— 高频维认「相邻位置」，低频维看「长距离」
  </text>

  <!-- 网格：位置 0..70（每 10 一格），值 -1..1（每 0.5 一格） -->
  <g stroke="#e4e7eb" stroke-width="1">
    <line x1="200" y1="80" x2="200" y2="400"/>
    <line x1="310" y1="80" x2="310" y2="400"/>
    <line x1="420" y1="80" x2="420" y2="400"/>
    <line x1="530" y1="80" x2="530" y2="400"/>
    <line x1="640" y1="80" x2="640" y2="400"/>
    <line x1="750" y1="80" x2="750" y2="400"/>
    <line x1="860" y1="80" x2="860" y2="400"/>
    <line x1="90" y1="90" x2="860" y2="90"/>
    <line x1="90" y1="165" x2="860" y2="165"/>
    <line x1="90" y1="315" x2="860" y2="315"/>
    <line x1="90" y1="390" x2="860" y2="390"/>
  </g>

  <!-- 坐标轴：0 线（值 0）与左轴 -->
  <line x1="90" y1="240" x2="860" y2="240" stroke="#999" stroke-width="1.6"/>
  <line x1="90" y1="80" x2="90" y2="400" stroke="#999" stroke-width="1.6"/>

  <!-- x 轴刻度：位置 -->
  <text x="90" y="262" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="200" y="262" text-anchor="middle" font-size="12" fill="#666">10</text>
  <text x="310" y="262" text-anchor="middle" font-size="12" fill="#666">20</text>
  <text x="420" y="262" text-anchor="middle" font-size="12" fill="#666">30</text>
  <text x="530" y="262" text-anchor="middle" font-size="12" fill="#666">40</text>
  <text x="640" y="262" text-anchor="middle" font-size="12" fill="#666">50</text>
  <text x="750" y="262" text-anchor="middle" font-size="12" fill="#666">60</text>
  <text x="860" y="262" text-anchor="middle" font-size="12" fill="#666">70</text>
  <text x="475" y="288" text-anchor="middle" font-size="13" fill="#333">位置 pos →</text>

  <!-- y 轴刻度：编码值 -->
  <text x="82" y="394" text-anchor="end" font-size="12" fill="#666">-1</text>
  <text x="82" y="319" text-anchor="end" font-size="12" fill="#666">-0.5</text>
  <text x="82" y="244" text-anchor="end" font-size="12" fill="#666">0</text>
  <text x="82" y="169" text-anchor="end" font-size="12" fill="#666">0.5</text>
  <text x="82" y="94" text-anchor="end" font-size="12" fill="#666">1</text>

  <!-- 三条曲线（由脚本按公式生成） -->
  <polyline points="90.0,240.0 112.0,103.6 134.0,353.5 156.0,281.9 178.0,91.6 200.0,321.6 222.0,320.5 244.0,91.4 266.0,283.2 288.0,352.6 310.0,103.1 332.0,241.3 354.0,375.8 376.0,125.6 398.0,199.4 420.0,388.2 442.0,157.3 464.0,160.6 486.0,388.8 508.0,195.5 530.0,128.2 552.0,377.5 574.0,237.3 596.0,104.7 618.0,355.2 640.0,279.4 662.0,92.0 684.0,323.8 706.0,318.2 728.0,91.1 750.0,285.7 772.0,350.9 794.0,102.0 816.0,244.0 838.0,374.7 860.0,123.9" fill="none" stroke="#e53935" stroke-width="2.5" stroke-linejoin="round"/>0__
  <polyline points="90.0,240.0 112.0,103.6 134.0,353.5 156.0,281.9 178.0,91.6 200.0,321.6 222.0,320.5 244.0,91.4 266.0,283.2 288.0,352.6 310.0,103.1 332.0,241.3 354.0,375.8 376.0,125.6 398.0,199.4 420.0,388.2 442.0,157.3 464.0,160.6 486.0,388.8 508.0,195.5 530.0,128.2 552.0,377.5 574.0,237.3 596.0,104.7 618.0,355.2 640.0,279.4 662.0,92.0 684.0,323.8 706.0,318.2 728.0,91.1 750.0,285.7 772.0,350.9 794.0,102.0 816.0,244.0 838.0,374.7 860.0,123.9" fill="none" stroke="#e53935" stroke-width="2.5" stroke-linejoin="round"/>1__
  <polyline points="90.0,240.0 112.0,103.6 134.0,353.5 156.0,281.9 178.0,91.6 200.0,321.6 222.0,320.5 244.0,91.4 266.0,283.2 288.0,352.6 310.0,103.1 332.0,241.3 354.0,375.8 376.0,125.6 398.0,199.4 420.0,388.2 442.0,157.3 464.0,160.6 486.0,388.8 508.0,195.5 530.0,128.2 552.0,377.5 574.0,237.3 596.0,104.7 618.0,355.2 640.0,279.4 662.0,92.0 684.0,323.8 706.0,318.2 728.0,91.1 750.0,285.7 772.0,350.9 794.0,102.0 816.0,244.0 838.0,374.7 860.0,123.9" fill="none" stroke="#e53935" stroke-width="2.5" stroke-linejoin="round"/>2__

  <!-- 图例 -->
  <rect x="620" y="92" width="255" height="158" rx="8" fill="#fafafa" fill-opacity="0.94" stroke="#ddd"/>
  <line x1="638" y1="122" x2="678" y2="122" stroke="#e53935" stroke-width="3"/>
  <text x="690" y="127" font-size="13" fill="#333">i=0：频率 1.00，周期 ≈6.3</text>
  <line x1="638" y1="152" x2="678" y2="152" stroke="#1e88e5" stroke-width="3"/>
  <text x="690" y="157" font-size="13" fill="#333">i=1：频率 0.10，周期 ≈63</text>
  <line x1="638" y1="182" x2="678" y2="182" stroke="#43a047" stroke-width="3"/>
  <text x="690" y="187" font-size="13" fill="#333">i=2：频率 0.01，周期 ≈628</text>
  <text x="638" y="220" font-size="13" fill="#555">高频维（秒针）：区分「差几位」的相邻词</text>
  <text x="638" y="240" font-size="13" fill="#555">低频维（时针）：0..70 内几乎一条直线，</text>
  <text x="638" y="258" font-size="13" fill="#555">负责长距离的整体趋势</text>
</svg>
