<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="sans-serif">
  <!-- ============ 马氏距离：把数据形状考虑进来的距离 ============ -->
  <!-- 数据云沿 45° 拉长（有相关性的两个特征），等马氏距离面 = 椭圆 -->
  <!-- P₁ 沿长轴方向（数据密集方向）：欧氏远、马氏近 -->
  <!-- P₂ 沿短轴方向（数据稀疏方向）：欧氏近、马氏远 -->
  <!-- 关键：欧氏用「圆」量距离，马氏用「按数据形状压扁的椭圆」量距离 -->

  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold">
    马氏距离：距离按「数据的分布形状」来度量，而不是死板的圆
  </text>

  <!-- 中心 = 查询点 q（一组特征的中心） -->
  <circle cx="300" cy="230" r="7" fill="#37474f"/>
  <text x="316" y="225" font-size="14" fill="#333">q（中心）</text>

  <!-- 数据云：沿 45° 拉长的椭圆（协方差等高线），中心 (300,230) -->
  <!-- 长轴半径 150（沿 45°），短轴半径 60（垂直 45°） -->
  <g transform="rotate(-45 300 230)">
    <ellipse cx="300" cy="230" rx="150" ry="60" fill="#1e88e5" fill-opacity="0.12" stroke="none"/>
    <ellipse cx="300" cy="230" rx="150" ry="60" fill="none" stroke="#42a5f5" stroke-width="2"/>
    <ellipse cx="300" cy="230" rx="90"  ry="36" fill="none" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,4"/>
  </g>

  <!-- 散点（模拟训练样本，聚在长轴附近） -->
  <g fill="#1565c0">
    <circle cx="330" cy="200" r="3.5"/>
    <circle cx="360" cy="170" r="3.5"/>
    <circle cx="345" cy="215" r="3.5"/>
    <circle cx="270" cy="260" r="3.5"/>
    <circle cx="240" cy="290" r="3.5"/>
    <circle cx="255" cy="245" r="3.5"/>
    <circle cx="390" cy="140" r="3.5"/>
    <circle cx="210" cy="320" r="3.5"/>
    <circle cx="300" cy="230" r="3.5"/>
    <circle cx="420" cy="110" r="3.5"/>
    <circle cx="180" cy="350" r="3.5"/>
    <circle cx="350" cy="250" r="3.5"/>
    <circle cx="250" cy="210" r="3.5"/>
  </g>

  <!-- 欧氏视角：以 q 为圆心的「等距圆」穿过 P₁、P₂ → 欧氏认为一样远 -->
  <circle cx="300" cy="230" r="120" fill="none" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="430" y="205" font-size="12" fill="#757575">欧氏等距圆（虚线）</text>

  <!-- 长轴方向点 P₁（沿数据密集方向，120px 处） -->
  <circle cx="385" cy="145" r="7" fill="#2e7d32"/>
  <text x="330" y="120" font-size="14" fill="#1b5e20">P₁：沿长轴（密集方向）</text>
  <text x="330" y="137" font-size="13" fill="#2e7d32">马氏近 ✓</text>

  <!-- 短轴方向点 P₂（沿数据稀疏方向，垂直于长轴） -->
  <!-- 短轴（左上↔右下）：取左上，dx=−85, dy=−85 → (215,145)；距 q 同为 ~120px -->
  <circle cx="215" cy="145" r="7" fill="#c62828"/>
  <text x="60" y="90" font-size="14" fill="#b71c1c">P₂：沿短轴（稀疏方向）</text>
  <text x="60" y="107" font-size="13" fill="#c62828">马氏远 ✗</text>

  <!-- 连接线 -->
  <line x1="300" y1="230" x2="385" y2="145" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="300" y1="230" x2="215" y2="145" stroke="#c62828" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 底部结论 -->
  <text x="470" y="420" text-anchor="middle" font-size="16" fill="#333">
    两个点到 q 的欧氏距离一样（都在同一个虚线圈上）——但数据明明沿着 45° 方向分布：
  </text>
  <text x="470" y="444" text-anchor="middle" font-size="15" fill="#1b5e20">
    P₁ 在数据密集的方向上，马氏认为「正常、近」；P₂ 偏离主流分布，马氏认为「异常、远」。
  </text>
</svg>
