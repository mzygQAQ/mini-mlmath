<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="sans-serif">
  <!-- ============ Tensor / Impl / GradNode 的关系：谁拥有谁，决定会不会泄漏 ============ -->
  <defs>
    <marker id="own" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="nraw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb8c00"/>
    </marker>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="21" font-weight="bold">Tensor / Impl / GradNode 的关系</text>
  <text x="480" y="50" text-anchor="middle" font-size="14" fill="#666">句柄（Tensor）→ 内核（Impl）→ 反向节点（GradNode）；「谁拥有谁」决定图会不会内存泄漏</text>

  <!-- ================= 区① 数据结构 ================= -->
  <text x="480" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">① 数据结构：句柄 / 内核 / 节点</text>

  <!-- Tensor 句柄 -->
  <rect x="40"  y="108" width="86" height="56" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="83" y="132" text-anchor="middle" font-size="16" font-weight="bold">t1</text>
  <text x="83" y="152" text-anchor="middle" font-size="11" fill="#555">Tensor 句柄</text>

  <rect x="150" y="108" width="86" height="56" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="193" y="132" text-anchor="middle" font-size="16" font-weight="bold">t2</text>
  <text x="193" y="152" text-anchor="middle" font-size="11" fill="#555">Tensor 句柄</text>
  <text x="118" y="185" text-anchor="middle" font-size="11" fill="#777">b = a 时两个句柄</text>
  <text x="118" y="199" text-anchor="middle" font-size="11" fill="#777">共享同一个内核</text>

  <!-- Impl 内核 -->
  <rect x="320" y="100" width="300" height="185" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2.5"/>
  <text x="470" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Impl（共享内核）</text>
  <text x="336" y="152" font-size="13" fill="#333">value : Matrix&lt;T&gt;</text>
  <text x="336" y="178" font-size="13" fill="#333">grad  : Matrix&lt;T&gt;</text>
  <text x="336" y="204" font-size="13" fill="#333">grad_fn : shared_ptr&lt;GradNode&gt;</text>
  <text x="336" y="230" font-size="13" fill="#333">track : bool</text>
  <text x="336" y="260" font-size="11" fill="#777">grad_fn = 谁生产了我（叶子为 null）</text>

  <!-- GradNode 节点 -->
  <rect x="690" y="100" width="240" height="185" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="810" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">GradNode（反向节点）</text>
  <text x="706" y="152" font-size="13" fill="#333">out_    : Impl*（非拥有）</text>
  <text x="706" y="178" font-size="13" fill="#333">inputs_ : vector&lt;Tensor&lt;T&gt;&gt;</text>
  <text x="706" y="204" font-size="13" fill="#333">apply() : 局部梯度公式</text>
  <text x="706" y="260" font-size="11" fill="#777">out_ 指回「我生产的那个 Impl」</text>

  <!-- 关键双向箭头：Impl ⇄ GradNode -->
  <!-- grad_fn（拥有，实线）-->
  <line x1="622" y1="190" x2="688" y2="150" stroke="#37474f" stroke-width="2.5" marker-end="url(#own)"/>
  <text x="690" y="185" font-size="12" fill="#37474f">grad_fn</text>
  <text x="648" y="205" font-size="12" fill="#37474f">shared_ptr（拥有）</text>

  <!-- out_（非拥有，虚线）-->
  <line x1="690" y1="250" x2="622" y2="250" stroke="#fb8c00" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#nraw)"/>
  <text x="690" y="272" font-size="12" fill="#e65100">out_</text>
  <text x="648" y="292" font-size="12" fill="#e65100">裸指针（非拥有）</text>

  <!-- Tensor -> Impl（shared_ptr）-->
  <line x1="126" y1="136" x2="318" y2="150" stroke="#37474f" stroke-width="2" marker-end="url(#own)"/>
  <text x="216" y="142" font-size="12" fill="#37474f">shared_ptr</text>
  <line x1="236" y1="136" x2="318" y2="200" stroke="#37474f" stroke-width="2" marker-end="url(#own)"/>
  <text x="256" y="192" font-size="12" fill="#37474f">shared_ptr</text>

  <!-- 防环提醒 -->
  <rect x="320" y="298" width="610" height="30" rx="8" fill="#fff8e1" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="625" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">如果 out_ 也用 shared_ptr，上面这两条线就成环（Impl ⇄ GradNode），引用计数永不归零 → 泄漏</text>

  <!-- ================= 区② 真实计算图 ================= -->
  <text x="480" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#37474f">② 引用方向：输出持节点、节点持更早的输入 —— 严格单向，无环</text>

  <!-- a / w 叶子 -->
  <rect x="40"  y="390" width="110" height="72" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="95" y="418" text-anchor="middle" font-size="16" font-weight="bold">a</text>
  <text x="95" y="444" text-anchor="middle" font-size="11" fill="#888">叶子 · grad_fn=null</text>

  <rect x="180" y="390" width="110" height="72" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="235" y="418" text-anchor="middle" font-size="16" font-weight="bold">w</text>
  <text x="235" y="444" text-anchor="middle" font-size="11" fill="#888">叶子 · grad_fn=null</text>

  <!-- MulNode -->
  <rect x="330" y="382" width="130" height="88" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="395" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">MulNode</text>
  <text x="395" y="438" text-anchor="middle" font-size="11" fill="#2e7d32">inputs_: a, w</text>
  <text x="395" y="456" text-anchor="middle" font-size="11" fill="#2e7d32">out_: y</text>

  <!-- y -->
  <rect x="520" y="390" width="110" height="72" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="575" y="418" text-anchor="middle" font-size="16" font-weight="bold">y</text>
  <text x="575" y="444" text-anchor="middle" font-size="11" fill="#555">中间张量</text>

  <!-- SumNode -->
  <rect x="680" y="382" width="130" height="88" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2.5"/>
  <text x="745" y="414" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">SumNode</text>
  <text x="745" y="438" text-anchor="middle" font-size="11" fill="#2e7d32">inputs_: y</text>
  <text x="745" y="456" text-anchor="middle" font-size="11" fill="#2e7d32">out_: loss</text>

  <!-- loss -->
  <rect x="860" y="390" width="90" height="72" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2"/>
  <text x="905" y="418" text-anchor="middle" font-size="16" font-weight="bold">loss</text>
  <text x="905" y="444" text-anchor="middle" font-size="11" fill="#c62828">用户持有</text>

  <!-- 引用箭头 -->
  <!-- MulNode.inputs_ -> a / w（拥有）-->
  <line x1="150" y1="416" x2="328" y2="420" stroke="#37474f" stroke-width="2.5" marker-end="url(#own)"/>
  <text x="236" y="408" font-size="12" fill="#37474f">inputs_ (shared)</text>
  <line x1="290" y1="430" x2="328" y2="442" stroke="#37474f" stroke-width="2.5" marker-end="url(#own)"/>
  <text x="330" y="466" font-size="12" fill="#37474f">inputs_ (shared)</text>

  <!-- MulNode.out_ -> y（非拥有，虚线）-->
  <line x1="460" y1="452" x2="518" y2="444" stroke="#fb8c00" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#nraw)"/>
  <text x="452" y="478" font-size="12" fill="#e65100">out_ (裸指针)</text>

  <!-- y.grad_fn -> MulNode（拥有）-->
  <line x1="575" y1="462" x2="462" y2="470" stroke="#37474f" stroke-width="2.5" marker-end="url(#own)"/>
  <text x="500" y="500" font-size="12" fill="#37474f">y.grad_fn (shared)</text>

  <!-- SumNode.inputs_ -> y（拥有）-->
  <line x1="630" y1="418" x2="678" y2="416" stroke="#37474f" stroke-width="2.5" marker-end="url(#own)"/>
  <text x="630" y="406" font-size="12" fill="#37474f">inputs_ (shared)</text>

  <!-- SumNode.out_ -> loss（非拥有，虚线）-->
  <line x1="810" y1="452" x2="858" y2="444" stroke="#fb8c00" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#nraw)"/>
  <text x="800" y="478" font-size="12" fill="#e65100">out_ (裸指针)</text>

  <!-- loss.grad_fn -> SumNode（拥有）-->
  <line x1="905" y1="462" x2="812" y2="470" stroke="#37474f" stroke-width="2.5" marker-end="url(#own)"/>
  <text x="845" y="500" font-size="12" fill="#37474f">loss.grad_fn (shared)</text>

  <!-- ================= 图例 ================= -->
  <line x1="40"  y1="540" x2="150" y2="540" stroke="#37474f" stroke-width="3"/>
  <text x="160" y="545" font-size="13" fill="#333">实线 = shared_ptr（拥有，负责生命周期）</text>
  <line x1="450" y1="540" x2="560" y2="540" stroke="#fb8c00" stroke-width="3" stroke-dasharray="7,5"/>
  <text x="570" y="545" font-size="13" fill="#333">虚线 = 裸指针（非拥有，只读）</text>

  <text x="480" y="568" text-anchor="middle" font-size="12" fill="#777">释放：用户丢 loss → 释放 SumNode → 释放 inputs_(y) → 释放 MulNode → 释放 a/w，从新到旧级联，无环</text>
</svg>
